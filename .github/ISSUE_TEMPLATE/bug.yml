name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a token. Redact SPIFFE IDs and hostnames you would rather not share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version and installation type
      placeholder: 2026.11.0, Home Assistant OS
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: SPIFFE agent and version
      placeholder: spiffex 0.4.1, SPIRE 1.13, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From Settings → System → Logs, filtered on "spiffe".
      render: text
