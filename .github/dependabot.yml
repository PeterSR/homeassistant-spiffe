version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Pinned in manifest.json too, and Home Assistant installs that one. Bump both by hand.
      - dependency-name: spiffe
      # Pinned to match Home Assistant's package constraints.
      - dependency-name: cffi
      - dependency-name: cryptography
      - dependency-name: grpcio
      - dependency-name: protobuf
      - dependency-name: pyjwt
