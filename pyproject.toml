[project]
name = "homeassistant-spiffe"
version = "0.1.0"
description = "A SPIFFE identity for Home Assistant, from any SPIFFE Workload API"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.375",
    "spiffe==0.4.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.spiffe"]
known-third-party = ["homeassistant"]

[tool.uv]
# Not a Python package: this file only pins the test and lint tools.
package = false
environments = ["sys_platform == 'linux'"]
# Test with the versions Home Assistant pins (its package_constraints.txt for the release the test
# harness targets), not whatever is newest on PyPI.
constraint-dependencies = [
    "cffi==2.0.0",
    "cryptography==50.0.1",
    "grpcio==1.83.1",
    "protobuf==7.36.0",
    "pyjwt==2.15.1",
]
